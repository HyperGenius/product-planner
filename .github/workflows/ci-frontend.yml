name: CI Frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  # PR の run で保存したキャッシュはその PR からしか復元できないので、main でも走らせて
  # 全 PR が初回から使えるキャッシュを作る
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # next build 時に一部モジュールが参照するためのダミー値 (実際のSupabase/Renderには接続しない)
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key-for-ci-build
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: '20'

      # setup-node の `cache: 'npm'` は ~/.npm（ダウンロード済みの tarball）しか持たず、npm ci の展開に毎回
      # 20秒以上かかっていたため、node_modules そのものをキャッシュし、ヒットしたら npm ci を飛ばす。
      # ネイティブバイナリを含むので OS・Node のバージョンもキーに入れる
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

      # .next/cache はキャッシュしない。Next.js 16 の next build（Turbopack）はコンパイル結果を .next/cache に
      # 残さず（約100KB）、キャッシュがヒットしてもビルド時間は変わらなかった
      - name: Build
        run: npm run build
